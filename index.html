<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Status Monitor</title>
<style>
:root{
  --bg:#080d19;--panel:#111a2b;--panel2:#17233b;--text:#f4f7ff;
  --muted:#9aa8c4;--green:#35d486;--red:#ff5c73;--yellow:#ffc857;
  --blue:#5688ff;--line:#263553;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;color:var(--text);
  background:radial-gradient(circle at top,#182852 0%,var(--bg) 48%);
}
.wrap{max-width:1050px;margin:auto;padding:34px 18px 50px}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,42px)}
.subtitle{margin:0;color:var(--muted)}
button{
  border:0;border-radius:10px;padding:11px 16px;background:var(--blue);
  color:white;font-weight:800;cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat,.card{background:rgba(17,26,43,.94);border:1px solid var(--line);border-radius:15px}
.stat{padding:16px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}
#list{display:grid;gap:12px}

.card{
  padding:17px;display:grid;grid-template-columns:62px 1fr auto;
  align-items:start;gap:15px;
}
.avatar{
  width:62px;height:62px;border-radius:12px;object-fit:cover;background:#202b48;
  display:flex;align-items:center;justify-content:center;font-size:25px
}
.name-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.name{font-size:18px;font-weight:800}
.role{
  font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:4px 7px;
  border-radius:999px;background:#243252;color:#b8c8ee
}
.note-badge{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  padding:4px 7px;border-radius:999px;
  background:rgba(255,200,87,.14);color:var(--yellow)
}
.meta{color:var(--muted);font-size:13px;margin-top:5px}
.status{min-width:105px;text-align:right;font-weight:800}
.dot{
  display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:6px;background:var(--red)
}
.online .dot,.ingame .dot{background:var(--green)}
.ingame .dot{box-shadow:0 0 10px rgba(53,212,134,.7)}
.studio .dot{background:var(--yellow)}
.unknown .dot{background:var(--yellow)}
.error{color:var(--red)}
a{color:#7fa5ff;text-decoration:none}a:hover{text-decoration:underline}

/* ---- queue row ---- */
.queue-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:11px;padding-top:11px;
  border-top:1px dashed rgba(38,53,83,.75);
}
.queue-badge{
  font-size:12px;color:var(--muted);
  background:#1a2740;border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.queue-badge b{color:var(--text);font-size:15px;margin-left:3px}
.queue-input{
  width:112px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line);background:#0d1628;color:var(--text);
  font:inherit;font-size:13px;
}
.queue-input:focus{outline:2px solid rgba(86,136,255,.55);outline-offset:1px}
.queue-submit{
  padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;
  background:var(--blue);color:white;
}
.queue-updated{font-size:11px;color:var(--muted);margin-left:auto}

.footer{color:var(--muted);text-align:center;font-size:12px;margin-top:18px}

@media(max-width:650px){
  header{align-items:stretch;flex-direction:column}
  .summary{grid-template-columns:1fr 1fr}
  .summary .stat:last-child{grid-column:span 2}
  .card{grid-template-columns:48px 1fr}
  .avatar{width:48px;height:48px}
  .status{grid-column:2;text-align:left}
  .queue-updated{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Roblox Status Monitor</h1>
    <p class="subtitle">Live presence + community-sourced queue lengths.</p>
  </div>
  <button id="refresh">Refresh statuses</button>
</header>

<section class="summary">
  <div class="stat"><b id="onlineCount">—</b><span>Online / active</span></div>
  <div class="stat"><b id="offlineCount">—</b><span>Offline</span></div>
  <div class="stat"><b id="updated">—</b><span>Last checked</span></div>
</section>

<main id="list"></main>

<div class="footer">
  Roblox presence is checked every 60 seconds • Queue values refresh every 30 seconds.
</div>
</div>

<script>
const API_BASE = "https://roblox-status-api.mohamedlaik.workers.dev";

const people = [
  // ── Admins ──
  { role:"Admin", username:"Angelethereal",   queue:700 },
  { role:"Admin", username:"Stalwartwarden",  queue:700 },
  { role:"Admin", username:"CoffeeRuntime",   queue:624,  note:"Newest" },
  { role:"Admin", username:"ThirteenDucks",   queue:null, note:"Lowest queues" },
  { role:"Admin", username:"brightgreenpart", queue:900 },
  { role:"Admin", username:"nauticalcaptain", queue:1000 },

  // ── Content creators ──
  { role:"Content Creator", username:"WeirdBlox",    queue:47  },
  { role:"Content Creator", username:"Dogbon62",     queue:182 },
  { role:"Content Creator", username:"1rex1",        queue:347 },
  { role:"Content Creator", username:"Nicole_Kimmi", queue:251 },
  { role:"Content Creator", username:"robey100",     queue:73  },
  { role:"Content Creator", username:"Crystalaco",   queue:300 },
  { role:"Content Creator", username:"LcLcO1",       queue:900 },
  { role:"Content Creator", username:"Jeny_Punker",  queue:null },

  // ── Developers ──
  { role:"Developer", username:"kxttyrei",       queue:600 },
  { role:"Developer", username:"MxnavFX",        queue:null },
  { role:"Developer", username:"arcisbored",     queue:null },
  { role:"Developer", username:"MAHAIO",         queue:null, note:"Lowest queues" },
  { role:"Developer", username:"Deathux",        queue:null, note:"High queues" },
  { role:"Developer", username:"brandonisbulk",  queue:null, note:"Full queues" },
  { role:"Developer", username:"jersito4",       queue:600, note:"600+" },
  { role:"Developer", username:"FLEETINGVORTEX", queue:600 },

  // ── Original roster ──
  { role:"Creator", username:"javie12", queue:null, note:"PS" },

  // ── Special link entry (no queue) ──
  {
    role:"Creator",
    special:true,
    title:"The Hunt: Roblox 20",
    url:"https://www.roblox.com/games/74205509034203/The-Hunt-Roblox-20?privateServerLinkCode=30112157627168132689738283351982"
  }
];

// Lowercase username → { value, updatedAt, history }
const queueState = {};

const list = document.getElementById("list");
const refreshButton = document.getElementById("refresh");

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ============================
   QUEUE helpers
   ============================ */

function queueValueFor(username){
  if(!username) return null;
  const s = queueState[username.toLowerCase()];
  if(!s) return null;
  return (s.value === null || s.value === undefined) ? null : s.value;
}

function queueRowHTML(username){
  if(!username) return "";

  const state = queueState[username.toLowerCase()];
  const val = (state && state.value !== null && state.value !== undefined)
    ? state.value : "—";
  const updated = state && state.updatedAt
    ? new Date(state.updatedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})
    : "";

  return `
    <div class="queue-row">
      <span class="queue-badge">Queue <b>${esc(val)}</b></span>
      <input class="queue-input" type="number" min="0" max="1000" step="1"
             placeholder="0–1000" inputmode="numeric">
      <button class="queue-submit" type="button">Update</button>
      <span class="queue-updated">${updated ? "Updated " + esc(updated) : ""}</span>
    </div>`;
}

async function fetchAllQueues(){
  const r = await fetch(API_BASE + "/queues", { method:"GET" });
  if(!r.ok){
    const t = await r.text();
    throw new Error(`Queue load failed ${r.status}: ${t}`);
  }
  const data = await r.json();
  for(const [k,v] of Object.entries(data || {})){
    queueState[k] = v;
  }
}

async function submitQueue(username, amount){
  const r = await fetch(API_BASE + "/queues", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, amount })
  });
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(data.error || `Queue error ${r.status}`);
  queueState[username.toLowerCase()] = {
    value: data.value,
    updatedAt: data.updatedAt,
    history: data.history || []
  };
  return data;
}

/* Delegated click for every Update button */
list.addEventListener("click", async (e) => {
  const btn = e.target.closest(".queue-submit");
  if(!btn) return;

  const card = btn.closest(".card");
  const username = card?.dataset.username;
  if(!username) return;

  const input = card.querySelector(".queue-input");
  const raw = input.value.trim();
  if(raw === ""){ input.focus(); return; }

  let amount = Number(raw);
  if(!Number.isFinite(amount)){ alert("Enter a number."); return; }
  if(amount > 1000) amount = 1000;
  if(amount < 0) amount = 0;

  btn.disabled = true;
  try{
    await submitQueue(username, amount);
    // Update just this card, not the whole list.
    const badge = card.querySelector(".queue-badge b");
    if(badge) badge.textContent = queueState[username.toLowerCase()].value;

    const upd = card.querySelector(".queue-updated");
    if(upd){
      upd.textContent = "Updated " +
        new Date(queueState[username.toLowerCase()].updatedAt)
          .toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }
    input.value = "";
  }catch(err){
    alert("Could not update: " + err.message);
  }finally{
    btn.disabled = false;
  }
});

/* Enter key inside an input triggers its card's Update button */
list.addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  const input = e.target.closest(".queue-input");
  if(!input) return;
  e.preventDefault();
  input.closest(".card").querySelector(".queue-submit")?.click();
});

/* ============================
   Roblox presence
   ============================ */

function renderLoading(){
  list.innerHTML = people.map(p => {
    if(p.special) return renderSpecial(p);
    return `
    <article class="card" data-username="${esc(p.username)}">
      <div class="avatar"></div>
      <div>
        <div class="name-row">
          <span class="name">${esc(p.username)}</span>
          <span class="role">${esc(p.role)}</span>
          ${p.note ? `<span class="note-badge">${esc(p.note)}</span>` : ""}
        </div>
        <div class="meta">Loading Roblox information…</div>
        ${queueRowHTML(p.username)}
      </div>
      <div class="status unknown"><span class="dot"></span>Checking</div>
    </article>`;
  }).join("");
}

function renderSpecial(p){
  return `
  <article class="card">
    <div class="avatar">🎮</div>
    <div>
      <div class="name-row">
        <span class="name"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></span>
        <span class="role">${esc(p.role)}</span>
      </div>
      <div class="meta">Private server link • Not a Roblox user.</div>
    </div>
    <div class="status"><span class="dot"></span>Link</div>
  </article>`;
}

async function api(path, body){
  const response = await fetch(API_BASE + path, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });

  if(!response.ok){
    const text = await response.text();
    throw new Error(`API error ${response.status}: ${text}`);
  }
  return response.json();
}

function statusInfo(presence){
  switch(presence?.userPresenceType){
    case 0: return { text:"Offline",   cls:"offline" };
    case 1: return { text:"Online",    cls:"online"  };
    case 2: return { text:"In Game",   cls:"ingame"  };
    case 3: return { text:"In Studio", cls:"studio"  };
    case 4: return { text:"Invisible", cls:"offline" };
    default:return { text:"Unknown",   cls:"unknown" };
  }
}

async function refresh(){
  refreshButton.disabled = true;
  renderLoading();

  try{
    const users = people.filter(p => !p.special);
    const usernames = users.map(p => p.username);

    const resolved = await api("/users", { usernames });
    const idByName = new Map(
      (resolved.data || []).map(u => [u.name.toLowerCase(), u])
    );

    const ids = (resolved.data || []).map(u => u.id);
    let presenceById = new Map();
    if(ids.length > 0){
      const presenceData = await api("/presence", { userIds: ids });
      presenceById = new Map(
        (presenceData.userPresences || []).map(p => [p.userId, p])
      );
    }

    list.innerHTML = people.map(p => {
      if(p.special) return renderSpecial(p);

      const user = idByName.get(p.username.toLowerCase());

      if(!user){
        return `
        <article class="card" data-username="${esc(p.username)}">
          <div class="avatar">?</div>
          <div>
            <div class="name-row">
              <span class="name">${esc(p.username)}</span>
              <span class="role">${esc(p.role)}</span>
              ${p.note ? `<span class="note-badge">${esc(p.note)}</span>` : ""}
            </div>
            <div class="meta error">Roblox username could not be found.</div>
            ${queueRowHTML(p.username)}
          </div>
          <div class="status unknown"><span class="dot"></span>Unknown</div>
        </article>`;
      }

      const presence = presenceById.get(user.id);
      const info = statusInfo(presence);
      const avatar =
        `https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=150&height=150&format=png`;

      let detail = `@${esc(user.name)}`;
      if(presence?.lastLocation){
        detail += ` • ${esc(presence.lastLocation)}`;
      }

      return `
      <article class="card ${info.cls}" data-username="${esc(p.username)}">
        <img class="avatar" src="${avatar}" alt="${esc(user.name)} avatar"
             onerror="this.style.visibility='hidden'">
        <div>
          <div class="name-row">
            <span class="name">${esc(user.displayName || user.name)}</span>
            <span class="role">${esc(p.role)}</span>
            ${p.note ? `<span class="note-badge">${esc(p.note)}</span>` : ""}
          </div>
          <div class="meta">${detail}</div>
          ${queueRowHTML(p.username)}
        </div>
        <div class="status ${info.cls}">
          <span class="dot"></span>${info.text}
        </div>
      </article>`;
    }).join("");

    const presences = users.map(p => {
      const u = idByName.get(p.username.toLowerCase());
      return u ? presenceById.get(u.id) : null;
    }).filter(Boolean);

    const active = presences.filter(p => [1,2,3].includes(p.userPresenceType)).length;
    const offline = users.length - active;

    document.getElementById("onlineCount").textContent = active;
    document.getElementById("offlineCount").textContent = offline;
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString([], {
        hour:"2-digit", minute:"2-digit", second:"2-digit"
      });

  }catch(error){
    list.innerHTML = `
    <article class="card">
      <div class="avatar">!</div>
      <div>
        <div class="name">Could not load Roblox data</div>
        <div class="meta error">${esc(error.message)}</div>
      </div>
    </article>`;

    document.getElementById("onlineCount").textContent = "—";
    document.getElementById("offlineCount").textContent = "—";
    document.getElementById("updated").textContent = "Error";
  }finally{
    refreshButton.disabled = false;
  }
}

/* Silently refresh queue badges without nuking the inputs */
async function refreshQueueBadges(){
  try{
    await fetchAllQueues();
    for(const card of list.querySelectorAll(".card[data-username]")){
      const username = card.dataset.username.toLowerCase();
      const state = queueState[username];
      const badge = card.querySelector(".queue-badge b");
      const upd = card.querySelector(".queue-updated");
      if(badge && state){
        badge.textContent =
          (state.value === null || state.value === undefined) ? "—" : state.value;
      }
      if(upd && state && state.updatedAt){
        upd.textContent = "Updated " +
          new Date(state.updatedAt).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      }
    }
  }catch(e){
    console.warn("Queue refresh failed:", e);
  }
}

refreshButton.addEventListener("click", refresh);

(async function boot(){
  // Load queues first so the first card render already has values.
  try{ await fetchAllQueues(); }
  catch(e){ console.warn("Initial queue load failed:", e); }

  refresh();
  setInterval(refresh, 60000);
  setInterval(refreshQueueBadges, 30000);
})();
</script>
</body>
</html>
